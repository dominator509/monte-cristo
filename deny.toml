[advisories]
yanked = "deny"
db-path = ".local-data/advisory-db"
db-urls = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # Transitive dependencies: png (via macroquad/image) and fontdue (via macroquad)
    # both pull in older versions that cannot be unified without forking those crates.
    # bitflags v1.3.2 is required by png v0.17.16 → image v0.24.9 → macroquad
    # hashbrown v0.13.2 is required by fontdue v0.7.3 → macroquad
    { name = "bitflags", version = "1.3.2" },
    { name = "hashbrown", version = "0.13.2" },
    # tracing-subscriber's env-filter feature pulls in matchers v0.1.0
    # which depends on an older regex-automata (0.1.10) and regex-syntax (0.6.29).
    { name = "regex-automata", version = "0.1.10" },
    { name = "regex-syntax", version = "0.6.29" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
